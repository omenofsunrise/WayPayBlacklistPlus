name: Deploy Vite SPA to Server

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'  # Измените с 18 на 20 или 22
          
      - name: Build
        run: |
          npm ci
          npm run build
          
      - name: Clean remote directory and deploy
        uses: appleboy/ssh-action@master
        with:
          host: 89.104.69.24
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Очищаем папку назначения
            rm -rf /var/www/blacklist.waypay.one/*
            mkdir -p /var/www/blacklist.waypay.one
            
      - name: Copy built files
        uses: appleboy/scp-action@master
        with:
          host: 89.104.69.24
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dist/*"
          target: "/var/www/blacklist.waypay.one"
          strip_components: 1
          
      - name: Set permissions
        uses: appleboy/ssh-action@master
        with:
          host: 89.104.69.24
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            chmod -R 755 /var/www/blacklist.waypay.one
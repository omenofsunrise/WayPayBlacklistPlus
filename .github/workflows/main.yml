name: Deploy Vite SPA to Server

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Debug - show structure
        run: |
          echo "Root directory:"
          ls -la
          echo "Project directory:"
          ls -la blacklist-plus/
          
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          
      - name: Install dependencies
        working-directory: ./blacklist-plus
        run: |
          npm ci --legacy-peer-deps
          
      - name: Build project
        working-directory: ./blacklist-plus
        run: |
          npm run build
          
      - name: Check build output
        working-directory: ./blacklist-plus
        run: |
          ls -la dist/
          
      - name: Clean remote directory
        uses: appleboy/ssh-action@master
        with:
          host: 89.104.69.24
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            rm -rf /var/www/blacklist.waypay.one/*
            mkdir -p /var/www/blacklist.waypay.one
            
      - name: Copy built files
        uses: appleboy/scp-action@master
        with:
          host: 89.104.69.24
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "blacklist-plus/dist/*"
          target: "/var/www/blacklist.waypay.one"
          strip_components: 2
          
      - name: Set permissions
        uses: appleboy/ssh-action@master
        with:
          host: 89.104.69.24
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            chmod -R 755 /var/www/blacklist.waypay.one